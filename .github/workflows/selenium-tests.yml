name: Selenium Maven Docker CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout GitHub Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # 3. Install Chrome
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      # 4. Run Maven Selenium TestNG Tests
      - name: Run Maven Tests
        run: mvn clean test

      # 5. Debug TestNG Failures
      - name: Debug TestNG Failures
        if: always()
        run: |
          echo "========== TESTNG REPORTS =========="
          echo "========== TEST RESULTS =========="
          cat target/surefire-reports/*.txt || true

          echo "========== XML REPORTS =========="
          grep -hE '<testsuite|<failure|<error' target/surefire-reports/TEST-*.xml || true

      # 6. Upload TestNG Reports
      - name: Upload TestNG Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestNG-Reports
          path: target/surefire-reports/
          if-no-files-found: ignore

      # 7. Setup Docker Buildx
      - name: Setup Docker Buildx
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v3

      # 8. Login to Docker Hub
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 9. Build and Push Docker Image
      - name: Build and Push Docker Image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/selenium:latest